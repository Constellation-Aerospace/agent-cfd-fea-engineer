<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title>Chamber pressure profile</title>
  <desc>Pressure ramps to 10 mbar over 40 minutes, then holds near 10 mbar through the 120 minute test window.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="40" y="34" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#16232d" font-weight="700">Chamber Pressure Profile</text>
  <text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7b8790">Used for all four TVAC tests</text>

  <line x1="90" y1="340" x2="930" y2="340" stroke="#16232d" stroke-width="2"/>
  <line x1="90" y1="70" x2="90" y2="340" stroke="#16232d" stroke-width="2"/>

  <line x1="90" y1="340" x2="90" y2="350" stroke="#16232d" stroke-width="1"/>
  <line x1="390" y1="340" x2="390" y2="350" stroke="#16232d" stroke-width="1"/>
  <line x1="690" y1="340" x2="690" y2="350" stroke="#16232d" stroke-width="1"/>
  <line x1="930" y1="340" x2="930" y2="350" stroke="#16232d" stroke-width="1"/>

  <line x1="82" y1="340" x2="90" y2="340" stroke="#16232d" stroke-width="1"/>
  <line x1="82" y1="270" x2="90" y2="270" stroke="#16232d" stroke-width="1"/>
  <line x1="82" y1="200" x2="90" y2="200" stroke="#16232d" stroke-width="1"/>
  <line x1="82" y1="130" x2="90" y2="130" stroke="#16232d" stroke-width="1"/>
  <line x1="82" y1="90" x2="90" y2="90" stroke="#16232d" stroke-width="1"/>

  <text x="40" y="346" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790">0</text>
  <text x="28" y="276" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790">200</text>
  <text x="28" y="206" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790">400</text>
  <text x="28" y="136" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790">600</text>
  <text x="28" y="96" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790">800</text>
  <text x="26" y="74" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790">1000</text>
  <text x="18" y="200" transform="rotate(-90 18 200)" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7b8790">Pressure (mbar)</text>

  <text x="82" y="370" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790">0 min</text>
  <text x="368" y="370" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790">40 min</text>
  <text x="666" y="370" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790">100 min</text>
  <text x="904" y="370" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790" text-anchor="end">120 min</text>
  <text x="510" y="396" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7b8790" text-anchor="middle">Time from start</text>

  <path d="M 90 88 L 390 88 L 390 88 L 690 88 L 930 88" fill="none" stroke="#0f4c68" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 90 88 L 390 88" fill="none" stroke="#b5501f" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8"/>
  <circle cx="90" cy="88" r="5" fill="#0f4c68"/>
  <circle cx="390" cy="88" r="5" fill="#0f4c68"/>
  <circle cx="690" cy="88" r="5" fill="#0f4c68"/>
  <circle cx="930" cy="88" r="5" fill="#0f4c68"/>

  <rect x="122" y="108" width="188" height="52" rx="10" fill="#eef6fb" stroke="#b9c3cb"/>
  <text x="216" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#16232d" text-anchor="middle" font-weight="700">Pull-down</text>
  <text x="216" y="147" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#16232d" text-anchor="middle">0 to 40 min</text>

  <rect x="452" y="108" width="184" height="52" rx="10" fill="#eef6fb" stroke="#b9c3cb"/>
  <text x="544" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#16232d" text-anchor="middle" font-weight="700">Deep-cold approach</text>
  <text x="544" y="147" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#16232d" text-anchor="middle">40 to 100 min</text>

  <rect x="742" y="108" width="160" height="52" rx="10" fill="#eef6fb" stroke="#b9c3cb"/>
  <text x="822" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#16232d" text-anchor="middle" font-weight="700">Final soak</text>
  <text x="822" y="147" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#16232d" text-anchor="middle">100 to 120 min</text>

  <text x="900" y="80" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790" text-anchor="end">Hold near 10 mbar</text>
</svg>
