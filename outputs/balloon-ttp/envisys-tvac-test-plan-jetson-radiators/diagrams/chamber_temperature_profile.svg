<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title>Chamber temperature profile</title>
  <desc>Temperature ramps from ambient to minus 30 C in the first 40 minutes, then continues to the coldest stable setpoint and holds for the final soak.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="40" y="34" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#16232d" font-weight="700">Chamber Temperature Profile</text>
  <text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7b8790">Used for all four TVAC tests</text>

  <line x1="90" y1="340" x2="930" y2="340" stroke="#16232d" stroke-width="2"/>
  <line x1="90" y1="70" x2="90" y2="340" stroke="#16232d" stroke-width="2"/>

  <line x1="90" y1="340" x2="90" y2="350" stroke="#16232d" stroke-width="1"/>
  <line x1="390" y1="340" x2="390" y2="350" stroke="#16232d" stroke-width="1"/>
  <line x1="690" y1="340" x2="690" y2="350" stroke="#16232d" stroke-width="1"/>
  <line x1="930" y1="340" x2="930" y2="350" stroke="#16232d" stroke-width="1"/>

  <line x1="82" y1="340" x2="90" y2="340" stroke="#16232d" stroke-width="1"/>
  <line x1="82" y1="270" x2="90" y2="270" stroke="#16232d" stroke-width="1"/>
  <line x1="82" y1="200" x2="90" y2="200" stroke="#16232d" stroke-width="1"/>
  <line x1="82" y1="130" x2="90" y2="130" stroke="#16232d" stroke-width="1"/>
  <line x1="82" y1="90" x2="90" y2="90" stroke="#16232d" stroke-width="1"/>

  <text x="46" y="346" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790">20</text>
  <text x="40" y="276" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790">0</text>
  <text x="34" y="206" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790">-20</text>
  <text x="34" y="136" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790">-40</text>
  <text x="34" y="96" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790">-60</text>
  <text x="18" y="200" transform="rotate(-90 18 200)" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7b8790">Temperature (C)</text>

  <text x="82" y="370" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790">0 min</text>
  <text x="368" y="370" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790">40 min</text>
  <text x="666" y="370" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790">100 min</text>
  <text x="904" y="370" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790" text-anchor="end">120 min</text>
  <text x="510" y="396" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7b8790" text-anchor="middle">Time from start</text>

  <path d="M 90 100 L 390 150 L 690 184 L 930 184" fill="none" stroke="#b5501f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="90" cy="100" r="5" fill="#b5501f"/>
  <circle cx="390" cy="150" r="5" fill="#b5501f"/>
  <circle cx="690" cy="184" r="5" fill="#b5501f"/>
  <circle cx="930" cy="184" r="5" fill="#b5501f"/>

  <line x1="90" y1="100" x2="390" y2="150" stroke="#0f4c68" stroke-width="2.5" stroke-dasharray="7 6"/>
  <line x1="390" y1="150" x2="690" y2="184" stroke="#0f4c68" stroke-width="2.5" stroke-dasharray="7 6"/>
  <line x1="690" y1="184" x2="930" y2="184" stroke="#0f4c68" stroke-width="2.5" stroke-dasharray="7 6"/>

  <rect x="118" y="108" width="194" height="52" rx="10" fill="#eef6fb" stroke="#b9c3cb"/>
  <text x="215" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#16232d" text-anchor="middle" font-weight="700">Pull-down</text>
  <text x="215" y="147" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#16232d" text-anchor="middle">Ambient to -30 C</text>

  <rect x="446" y="156" width="198" height="52" rx="10" fill="#eef6fb" stroke="#b9c3cb"/>
  <text x="545" y="178" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#16232d" text-anchor="middle" font-weight="700">Deep-cold approach</text>
  <text x="545" y="195" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#16232d" text-anchor="middle">Continue to the lowest stable setpoint</text>

  <rect x="742" y="156" width="160" height="52" rx="10" fill="#eef6fb" stroke="#b9c3cb"/>
  <text x="822" y="178" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#16232d" text-anchor="middle" font-weight="700">Final soak</text>
  <text x="822" y="195" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#16232d" text-anchor="middle">Hold at coldest stable point</text>

  <text x="900" y="80" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790" text-anchor="end">Target: -30 C, then colder if available</text>
</svg>
