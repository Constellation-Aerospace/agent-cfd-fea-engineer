<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
  <title>8-hour test sequence timeline</title>
  <desc>Timeline for the four Envisys TVAC cases: two full-radiator tests, two single-radiator tests, with short changeovers between them.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="40" y="34" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#16232d" font-weight="700">8-Hour Test Sequence Timeline</text>
  <text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7b8790">Planned order: 30 W both radiators, 10 W both radiators, 10 W single radiator, 30 W single radiator</text>

  <line x1="90" y1="220" x2="930" y2="220" stroke="#16232d" stroke-width="2"/>
  <line x1="90" y1="90" x2="90" y2="220" stroke="#16232d" stroke-width="2"/>

  <line x1="90" y1="220" x2="90" y2="228" stroke="#16232d" stroke-width="1"/>
  <line x1="300" y1="220" x2="300" y2="228" stroke="#16232d" stroke-width="1"/>
  <line x1="510" y1="220" x2="510" y2="228" stroke="#16232d" stroke-width="1"/>
  <line x1="720" y1="220" x2="720" y2="228" stroke="#16232d" stroke-width="1"/>
  <line x1="930" y1="220" x2="930" y2="228" stroke="#16232d" stroke-width="1"/>

  <text x="82" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790">0 h</text>
  <text x="286" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790">2 h</text>
  <text x="496" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790">4 h</text>
  <text x="706" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790">6 h</text>
  <text x="930" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790" text-anchor="end">8 h</text>
  <text x="510" y="292" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7b8790" text-anchor="middle">Elapsed time</text>

  <rect x="90" y="112" width="210" height="52" rx="12" fill="#0f4c68" opacity="0.92"/>
  <rect x="300" y="112" width="210" height="52" rx="12" fill="#b5501f" opacity="0.92"/>
  <rect x="510" y="112" width="210" height="52" rx="12" fill="#0f4c68" opacity="0.72"/>
  <rect x="720" y="112" width="210" height="52" rx="12" fill="#b5501f" opacity="0.72"/>

  <text x="195" y="134" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Case 1</text>
  <text x="195" y="151" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">30 W, both radiators</text>

  <text x="405" y="134" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Case 2</text>
  <text x="405" y="151" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">10 W, both radiators</text>

  <text x="615" y="134" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Case 3</text>
  <text x="615" y="151" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">10 W, single radiator</text>

  <text x="825" y="134" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Case 4</text>
  <text x="825" y="151" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">30 W, single radiator</text>

  <rect x="288" y="176" width="24" height="18" rx="5" fill="#eef6fb" stroke="#b9c3cb"/>
  <rect x="498" y="176" width="24" height="18" rx="5" fill="#eef6fb" stroke="#b9c3cb"/>
  <rect x="708" y="176" width="24" height="18" rx="5" fill="#eef6fb" stroke="#b9c3cb"/>
  <text x="840" y="188" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790" text-anchor="middle">10 min changeover / log review</text>

  <text x="90" y="88" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#7b8790">Repeat the same chamber profile for every case</text>
</svg>