[project]
name = "agent-cfd-fea-engineer"
version = "0.1.0"
description = "CFD/FEA engineering simulation agent: multiphase VOF exhaust discharge, thermal mixing, back-pressure, mesh independence, FEA, parametric studies, reports."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "gmsh",
    "pyvista",
    "meshio",
    "fluidfoam",
    "ccx2paraview",
    "jinja2",
    "markdown",
    "tabulate",
    "python-dotenv",
    "requests",
    # agent-framework-github-copilot is injected by CommandCenter at runtime
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
